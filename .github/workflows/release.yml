name: Build

# main'e her gönderimde ve PR'larda Mac'te derler: derleme hatası varsa burada görünür.
# Yayınlamaz ve imzalamaz. Sürümler yerelde ./release.sh ile imzalanıp yayınlanır
# ("Missing Code Signing" anahtarı yalnızca yayını yapan Mac'in Anahtar Zinciri'nde durur).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derle (Apple Silicon + Intel, ad-hoc imza)
        run: |
          chmod +x build.sh
          ./build.sh --universal
          codesign -dv --verbose=2 Missing.app 2>&1 | grep -E "Identifier|Authority|Signature" || true
