<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Missing — Neutral Frosted Glass Leaf</title>
  <desc>Single neutral silver-white frosted-glass leaf on a transparent background. Editable vector paths and gradients; no raster images.</desc>
  <defs>
    <linearGradient id="glass" x1="725" y1="230" x2="348" y2="839" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C0C7D1" stop-opacity=".92"/>
      <stop offset=".28" stop-color="#D1D7DF" stop-opacity=".88"/>
      <stop offset=".58" stop-color="#E0E5EB" stop-opacity=".83"/>
      <stop offset=".82" stop-color="#EAF0F5" stop-opacity=".86"/>
      <stop offset="1" stop-color="#F5F8FC" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="redDepth" cx="0" cy="0" r="1" gradientTransform="translate(624 373) rotate(133) scale(386 133)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8996A8" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#B0BBC9" stop-opacity=".42"/>
      <stop offset="1" stop-color="#D0D9E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frost" cx="0" cy="0" r="1" gradientTransform="translate(455 751) rotate(-42) scale(395 163)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#EDF2F8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="230" y1="300" x2="765" y2="755" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".97"/>
      <stop offset=".4" stop-color="#F2F6FB" stop-opacity=".7"/>
      <stop offset=".72" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".85"/>
    </linearGradient>
    <path id="leaf" d="M 150,851 C 131,850 128,837 130,815 C 145,510 471,220 848,175 C 872,172 883,184 881,208 C 867,546 553,842 174,853 C 165,853 157,853 150,851 Z"/>
    <clipPath id="clip"><use href="#leaf"/></clipPath>
    <filter id="soft" x="-40%" y="-100%" width="180%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <use href="#leaf" fill="url(#glass)"/>
  <g clip-path="url(#clip)">
    <use href="#leaf" fill="url(#redDepth)"/>
    <use href="#leaf" fill="url(#frost)"/>
    <path d="M 143,802 C 170,521 489,226 852,188" stroke="#FFFFFF" stroke-opacity=".53" stroke-width="23" filter="url(#soft)"/>
    <path d="M 153,838 C 497,848 823,565 867,253" stroke="#F6FAFF" stroke-opacity=".5" stroke-width="13" filter="url(#soft)"/>
  </g>
  <use href="#leaf" stroke="url(#rim)" stroke-width="2.5"/>
  <path d="M 144,794 C 174,518 486,233 837,188" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.4" stroke-linecap="round"/>
</svg>
